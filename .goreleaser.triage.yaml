# GoReleaser configuration for the `triage` plugin binary.
#
# Spec: openspec/changes/release-cycle/specs/release-cycle/spec.md
#   ("GoReleaser configuration layout" requirement).
#
# Invoked explicitly by `make release-triage`. GoReleaser does NOT
# auto-trigger from the `plugins/triage/vX.Y.Z` tag — the Make
# target extracts the bare semver and passes it via
# GORELEASER_CURRENT_TAG (the `monorepo.tag_prefix` field that would
# wire this up natively is Pro-only in v2). Adding a future
# first-party plugin means adding a sibling
# `.goreleaser.<plugin>.yaml` — never extending this file or the
# core one — plus a sibling Make target that does the same
# prefix-extraction.
#
# The archive name `tai-plugin-triage-{os}-{arch}.tar.gz` is the
# load-bearing contract: `core/internal/plugins.AssetFilename` returns
# this exact string and the plugin host's HTTP fetcher uses it to
# locate the asset in the GitHub Release. Drift breaks
# `tai plugins install triage`. A Go test pins this — see
# core/internal/plugins/fetch_test.go.
#
# Requires GoReleaser v2 (OSS — no Pro license required).

version: 2

project_name: tai-plugin-triage

# Subdirectory so `make release-snapshot` can run BOTH configs
# back-to-back without --clean wiping the previous run's output.
dist: dist/triage

before:
  hooks:
    - go mod tidy

builds:
  - id: triage
    main: ./plugins/triage/cmd/triage
    binary: triage
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # Independent linker-injection target — the triage version
      # package is deliberately separate from core's so the two can
      # be set to different values when released independently.
      - -s -w -X github.com/dmastrorillo/tai/plugins/triage/internal/version.String=v{{ .Version }}

archives:
  - id: triage
    ids:
      - triage
    # MUST equal `core/internal/plugins.AssetFilename("triage", os, arch)`.
    # That function returns `tai-plugin-triage-<os>-<arch>.tar.gz`
    # (always .tar.gz, even on Windows, because the plugin-host
    # fetcher reads tarballs only). Windows is therefore NOT
    # overridden to `.zip` here.
    name_template: "tai-plugin-triage-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      # The host requires a top-level `assets/` directory in every
      # plugin tarball and rejects one without it
      # (PLUGIN_ASSET_MISSING) — it is the guaranteed input to
      # SyncAssetsToTargets, the only sanctioned writer for target
      # directories.
      #
      # One entry per asset category, because the category directory
      # names are what the host routes on: `assets/commands/` lands at
      # `<target>/commands/tai-triage/`. strip_parent keeps only the
      # basename, so dst must name the category explicitly — a single
      # recursive glob would either flatten the categories away or
      # carry the whole `plugins/triage/assets/` prefix into the
      # tarball. Add a sibling entry if triage ever ships
      # `assets/skills/` or `assets/agents/`.
      - src: plugins/triage/assets/commands/*.md
        dst: assets/commands
        strip_parent: true

checksum:
  name_template: "checksums.txt"

# No `brews:`/`homebrew_casks:` block — plugins are not
# Homebrew-distributable. The plugin host discovers binaries by
# reading `<TAI_DATA_DIR>/plugins/<name>/<name>`; a binary in
# `/opt/homebrew/bin/` is invisible to it.

# GoReleaser's release step is DISABLED for triage. The OSS version
# of goreleaser v2 doesn't support `monorepo.tag_prefix` or
# `release.tag` (both Pro-only), so it can't natively publish to a
# prefixed tag like `plugins/triage/v0.5.0` while computing the
# bare semver `.Version` from it. Instead, `make release-triage`:
#   1. Runs goreleaser to BUILD artifacts under dist/triage/
#      (this config + GORELEASER_CURRENT_TAG=v0.5.0).
#   2. Calls `gh release create plugins/triage/v0.5.0 ...` to
#      create the GitHub Release at the full prefixed tag and
#      upload the artifacts.
# See RELEASE.md for the runbook.
release:
  disable: true

changelog:
  use: github
  sort: asc
  # Triage's changelog includes its own scope + the shared `pkg`
  # scope. A `feat(pkg): ...` commit appears here AND in core's
  # changelog the next time each binary releases — see design.md D6.
  filters:
    include:
      - "^feat\\((triage|pkg)\\):"
      - "^fix\\((triage|pkg)\\):"
      - "^perf\\((triage|pkg)\\):"
  groups:
    - title: Features
      regexp: "^feat\\((triage|pkg)\\):"
      order: 0
    - title: Fixes
      regexp: "^fix\\((triage|pkg)\\):"
      order: 1
    - title: Performance
      regexp: "^perf\\((triage|pkg)\\):"
      order: 2
